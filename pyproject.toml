[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daybreak-wake"
version = "1.1.1"
readme = "README.md"
description = "A home-aware wake-up service with a complete SSH terminal console"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["aiohttp==3.13.3", "prompt-toolkit==3.0.52"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
daybreak = "daybreak.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
